<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Chip Counter</title>
<style>
:root{--bg:#0f3d2e;--card:#14513c;--deep:#0c3324;--ink:#f3f1e8;--muted:#b9c9bf;--line:#2a6b52;--accent:#f2c14e;--pos:#7ee08a;--neg:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:6px 0 14px}
h2{font-size:1.05rem;margin:0 0 10px;color:var(--accent)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
input{background:var(--deep);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;width:100%}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--accent);color:#222;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:transparent;color:var(--neg);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.muted{color:var(--muted)}
.chip{width:26px;height:26px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);flex:none;display:inline-block}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:.9rem}
.num{text-align:right}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pot{font-size:2.2rem;font-weight:800;color:var(--accent);line-height:1}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pl{background:var(--deep);border:2px solid var(--line);border-radius:12px;padding:12px}
.pl.folded{opacity:.45}
.pl.win{border-color:var(--accent)}
.pl .name{font-weight:700;font-size:1.05rem}
.pl .nums{display:flex;gap:14px;margin:6px 0 10px}
.pl .nums b{font-size:1.2rem}
.bets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cb{display:flex;align-items:center;gap:6px;background:#174a37;color:var(--ink);border:1px solid var(--line);padding:6px 10px}
.cb .chip{width:20px;height:20px;border-width:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{padding:6px 10px;font-size:.9rem}
.winbtn.on{background:var(--accent);color:#222}
.winbtn{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.badge{font-size:.75rem;background:var(--neg);color:#222;border-radius:6px;padding:1px 6px;margin-left:6px}
.log{max-height:220px;overflow:auto;font-size:.92rem}
.log div{padding:4px 0;border-bottom:1px solid var(--line)}
.ok{color:var(--pos)}.warn{color:var(--neg)}
</style>
</head>
<body>
<main>
<h1>♠ Poker Chip Counter</h1>
<div id="app"></div>
</main>

<script>
const KEY = 'poker-chip-counter-v2';
const fresh = () => ({
  phase: 'setup',
  chips: [
    {name:'Bianca', color:'#ffffff', value:1},
    {name:'Rossa', color:'#d32f2f', value:5},
    {name:'Verde', color:'#2e7d32', value:25},
    {name:'Nera', color:'#212121', value:100}
  ],
  start: [20, 10, 4, 1],
  players: [{name:'Giocatore 1'},{name:'Giocatore 2'},{name:'Giocatore 3'}],
  hand: 1,
  history: []
});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e){ S = fresh(); }
let undoStack = [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const snap = () => { undoStack.push(JSON.stringify(S)); if (undoStack.length > 200) undoStack.shift(); };
const fmt = n => (Math.round(n*100)/100).toLocaleString('it-IT');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const startValue = () => S.chips.reduce((s,c,i) => s + (+S.start[i]||0)*(+c.value||0), 0);
const pot = () => S.players.reduce((s,p) => s + (p.bet||0), 0);
const minChip = () => Math.min(...S.chips.map(c => +c.value).filter(v => v > 0), 1);

function render(){
  document.getElementById('app').innerHTML = S.phase === 'setup' ? setupView() : gameView();
}

/* ---------- SETUP ---------- */
function setupView(){
  return `
  <section>
    <h2>1 · Chip e distribuzione iniziale</h2>
    <table>
      <thead><tr><th></th><th>Nome</th><th>Valore</th><th>Chip a testa</th><th></th></tr></thead>
      <tbody>
      ${S.chips.map((c,i)=>`
        <tr>
          <td><input type="color" value="${esc(c.color)}" data-chip="${i}" data-f="color" style="width:44px;height:36px;padding:2px"></td>
          <td><input type="text" value="${esc(c.name)}" data-chip="${i}" data-f="name"></td>
          <td><input type="number" min="0" step="any" value="${c.value}" data-chip="${i}" data-f="value" style="width:90px"></td>
          <td><input type="number" min="0" value="${S.start[i]||0}" data-start="${i}" style="width:80px"></td>
          <td><button class="x" data-act="delChip" data-i="${i}">✕</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="row" style="margin-top:10px">
      <button class="ghost" data-act="addChip">+ Aggiungi chip</button>
      <span class="muted">Stack iniziale per giocatore: <b id="sv" style="color:var(--ink)">${fmt(startValue())}</b></span>
    </div>
  </section>
  <section>
    <h2>2 · Giocatori</h2>
    ${S.players.map((p,i)=>`
      <div class="row">
        <input type="text" value="${esc(p.name)}" data-pname="${i}" style="flex:1">
        <button class="x" data-act="delPlayer" data-i="${i}">✕</button>
      </div>`).join('')}
    <button class="ghost" data-act="addPlayer">+ Aggiungi giocatore</button>
  </section>
  <button data-act="start" style="width:100%;padding:14px;font-size:1.1rem" ${S.players.length<2||startValue()<=0?'disabled':''}>▶ Distribuisci le chip e inizia</button>`;
}

/* ---------- GAME ---------- */
function gameView(){
  const P = pot();
  const winners = S.players.filter(p => p.win).length;
  const totalBuy = S.players.reduce((s,p)=>s+p.buyin,0);
  const totalNow = S.players.reduce((s,p)=>s+p.stack+(p.bet||0),0);
  return `
  <section>
    <div class="top">
      <div>
        <div class="muted">Mano #${S.hand} · Piatto</div>
        <div class="pot">${fmt(P)}</div>
      </div>
      <div class="acts">
        <button class="ghost" data-act="undo" ${undoStack.length?'':'disabled'}>↶ Annulla</button>
        <button class="ghost" data-act="clearBets" ${P?'':'disabled'}>Restituisci puntate</button>
        <button class="ghost" data-act="newGame">Nuova partita</button>
      </div>
    </div>
  </section>

  <div class="players">
  ${S.players.map((p,i)=>`
    <div class="pl ${p.folded?'folded':''} ${p.win?'win':''}">
      <div class="name">${esc(p.name)}${p.folded?'<span class="badge">PASSA</span>':''}${p.stack===0&&p.bet>0?'<span class="badge" style="background:var(--accent)">ALL-IN</span>':''}</div>
      <div class="nums">
        <span class="muted">Stack <b style="color:var(--ink)">${fmt(p.stack)}</b></span>
        <span class="muted">Puntata <b style="color:var(--accent)">${fmt(p.bet||0)}</b></span>
      </div>
      <div class="bets">
        ${S.chips.map((c,ci)=>`
          <button class="cb" data-act="bet" data-i="${i}" data-v="${c.value}" ${p.folded||p.stack<c.value?'disabled':''} title="Punta ${esc(c.name)}">
            <span class="chip" style="background:${esc(c.color)}"></span>+${fmt(c.value)}
          </button>`).join('')}
      </div>
      <div class="acts">
        <button class="ghost" data-act="call" data-i="${i}" ${p.folded||callAmt(i)<=0?'disabled':''}>Vedo ${callAmt(i)>0?fmt(Math.min(callAmt(i),p.stack)):''}</button>
        <button class="ghost" data-act="allin" data-i="${i}" ${p.folded||p.stack<=0?'disabled':''}>All-in</button>
        <button class="ghost" data-act="fold" data-i="${i}">${p.folded?'Rientra':'Passa'}</button>
        <button class="winbtn ${p.win?'on':''}" data-act="win" data-i="${i}" ${p.folded?'disabled':''}>🏆 Vince</button>
        <button class="ghost" data-act="rebuy" data-i="${i}" title="Aggiungi uno stack iniziale">+ Ricarica</button>
      </div>
    </div>`).join('')}
  </div>

  <section style="margin-top:14px">
    <button data-act="award" style="width:100%;padding:14px;font-size:1.1rem" ${P>0&&winners>0?'':'disabled'}>
      ${winners>1?`Dividi il piatto (${fmt(P)}) tra ${winners} vincitori`:winners===1?`Assegna il piatto (${fmt(P)}) al vincitore`:'Seleziona il vincitore (🏆) per chiudere la mano'}
    </button>
  </section>

  <section>
    <h2>Classifica</h2>
    <table>
      <thead><tr><th>Giocatore</th><th class="num">Comprato</th><th class="num">Stack</th><th class="num">+/−</th></tr></thead>
      <tbody>
      ${[...S.players].map(p=>({...p,tot:p.stack+(p.bet||0)})).sort((a,b)=>(b.tot-b.buyin)-(a.tot-a.buyin)).map(p=>{
        const net = p.tot - p.buyin;
        return `<tr><td>${esc(p.name)}</td><td class="num">${fmt(p.buyin)}</td><td class="num">${fmt(p.tot)}</td>
          <td class="num ${net>0?'pos':net<0?'neg':''}">${net>0?'+':''}${fmt(net)}</td></tr>`;}).join('')}
      </tbody>
    </table>
    <div class="${Math.abs(totalNow-totalBuy)<0.005?'ok':'warn'}" style="margin-top:8px;font-size:.9rem">
      Chip in gioco: ${fmt(totalNow)} su ${fmt(totalBuy)} distribuite ${Math.abs(totalNow-totalBuy)<0.005?'✓':'⚠'}
    </div>
  </section>

  ${S.history.length?`
  <section>
    <h2>Storico mani</h2>
    <div class="log">${S.history.slice().reverse().map(h=>`<div><b>Mano #${h.hand}</b> · piatto ${fmt(h.pot)} → ${h.result.map(r=>`${esc(r.name)} +${fmt(r.amount)}`).join(', ')}</div>`).join('')}</div>
  </section>`:''}`;
}

function callAmt(i){
  const max = Math.max(0, ...S.players.map(p => p.bet||0));
  return max - (S.players[i].bet||0);
}

/* ---------- ACTIONS ---------- */
const A = {
  addChip(){ S.chips.push({name:'Chip', color:'#1565c0', value:1}); S.start.push(0); },
  delChip(i){ S.chips.splice(i,1); S.start.splice(i,1); },
  addPlayer(){ S.players.push({name:'Giocatore '+(S.players.length+1)}); },
  delPlayer(i){ S.players.splice(i,1); },
  start(){
    const v = startValue();
    S.players = S.players.map(p => ({name:p.name, stack:v, buyin:v, bet:0, folded:false, win:false}));
    S.phase = 'game'; S.hand = 1; S.history = []; undoStack = [];
  },
  bet(i,v){ snap(); const p=S.players[i]; v=Math.min(+v,p.stack); p.stack-=v; p.bet=(p.bet||0)+v; },
  call(i){ snap(); const p=S.players[i]; const v=Math.min(callAmt(i),p.stack); p.stack-=v; p.bet+=v; },
  allin(i){ snap(); const p=S.players[i]; p.bet=(p.bet||0)+p.stack; p.stack=0; },
  fold(i){ snap(); const p=S.players[i]; p.folded=!p.folded; if(p.folded) p.win=false; },
  win(i){ S.players[i].win = !S.players[i].win; },
  rebuy(i){
    if(!confirm(`Aggiungere ${fmt(startValue())} allo stack di ${S.players[i].name}?`)) return false;
    snap(); const v=startValue(); S.players[i].stack+=v; S.players[i].buyin+=v;
  },
  clearBets(){ snap(); S.players.forEach(p=>{ p.stack+=p.bet||0; p.bet=0; }); },
  award(){
    snap();
    const P = pot(), ws = S.players.filter(p=>p.win), unit = minChip();
    const share = Math.floor(P/ws.length/unit)*unit;
    let rest = P - share*ws.length;
    const result = ws.map((p,k)=>{ const amt = share + (k===0?rest:0); p.stack += amt; return {name:p.name, amount:amt}; });
    S.history.push({hand:S.hand, pot:P, result});
    S.players.forEach(p=>{ p.bet=0; p.folded=false; p.win=false; });
    S.hand++;
  },
  undo(){ const s = undoStack.pop(); if(s) S = JSON.parse(s); },
  newGame(){
    if(!confirm('Iniziare una nuova partita? Gli stack attuali verranno azzerati.')) return false;
    S.phase='setup'; S.players = S.players.map(p=>({name:p.name})); S.history=[]; undoStack=[];
  }
};

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const r = A[b.dataset.act](b.dataset.i!==undefined?+b.dataset.i:undefined, b.dataset.v);
  if(r === false) return;
  save(); render();
});

document.addEventListener('input', e=>{
  const t = e.target, d = t.dataset;
  if(d.chip!==undefined){ S.chips[d.chip][d.f] = d.f==='value' ? Number(t.value) : t.value; }
  else if(d.start!==undefined){ S.start[d.start] = Math.max(0, parseInt(t.value)||0); }
  else if(d.pname!==undefined){ S.players[d.pname].name = t.value; }
  else return;
  save();
  const sv = document.getElementById('sv'); if(sv) sv.textContent = fmt(startValue());
  const st = document.querySelector('[data-act="start"]'); if(st) st.disabled = S.players.length<2 || startValue()<=0;
});

render();
</script>
</body>
</html>
